# Release binaries for linux/amd64 and linux/arm64 on tag push.
#
# CGO note: the SQLite driver (mattn/go-sqlite3) requires cgo, so plain
# GOOS/GOARCH cross-compilation does not work without a C cross toolchain.
# Instead of cross toolchains, this workflow builds each arch NATIVELY on a
# matching runner: ubuntu-24.04 (amd64) and ubuntu-24.04-arm (arm64; free
# for public repos per GitHub's hosted-runner policy). Both runners are
# Ubuntu 24.04, so the produced binaries link the runner's glibc. The
# release job reads the newest GLIBC_x.y symbol version each binary needs
# and prints it in the release notes, so the floor is measured, not assumed.
#
# A tag with a hyphen (v1.0.0-rc.1) publishes a prerelease that reuses the
# CHANGELOG section of its base version, so the pipeline can be proven end
# to end before the real tag is pushed.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  ci:
    # The full CI suite (build, race tests, lint, govulncheck, client tests
    # and the vendored-client drift check) must pass on the tagged commit.
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # CI above runs on amd64 only; this is the arm64 race-test pass.
      - run: go test -race ./...
      - name: Build release binary
        # -X main.version stamps the tag into the binary, so `wirefan
        # --version` and the "wirefan starting" log line name the release.
        run: |
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "wirefan_${GITHUB_REF_NAME}_linux_${{ matrix.goarch }}" \
            ./cmd/wirefan
      - name: Smoke-test the binary
        # Assert the binary executes on this architecture and reports
        # exactly the tag it was built from.
        run: |
          ldd --version | head -n1
          out="$("./wirefan_${GITHUB_REF_NAME}_linux_${{ matrix.goarch }}" --version)"
          echo "$out"
          case "$out" in
            "wirefan ${GITHUB_REF_NAME} ("*) ;;
            *) echo "version mismatch: expected tag ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: wirefan-linux-${{ matrix.goarch }}
          path: wirefan_*_linux_${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum wirefan_* > SHA256SUMS
          cat SHA256SUMS
      - name: Write release notes
        # The body is the base version's CHANGELOG section (v1.0.0-rc.1 uses
        # 1.0.0), so the notes are the reviewed prose rather than a list of
        # commit subjects. A tag with no matching "## [x.y.z]" heading fails
        # the release. A downloads table with the measured glibc floor of
        # each binary and the checksum command is appended.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          base="${ver%%-*}"
          awk -v head="## [${base}]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "CHANGELOG.md has no section for ${base}" >&2
            exit 1
          fi
          {
            if [ "$ver" != "$base" ]; then
              echo "Release candidate for ${base}. Not for production use."
              echo
            fi
            cat section.md
            echo
            echo "### Downloads"
            echo
            echo "| File | Platform | Needs glibc |"
            echo "|---|---|---|"
            for f in dist/wirefan_*_linux_*; do
              name="$(basename "$f")"
              arch="${name##*_}"
              floor="$(grep -aoE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' "$f" | sed 's/GLIBC_//' | sort -uV | tail -n1)"
              echo "| \`${name}\` | linux/${arch} | ${floor} or newer |"
            done
            echo
            echo "Verify a download against the published checksums:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            $pre \
            --title "wirefan $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/wirefan_* dist/SHA256SUMS
