# deploy/caddy-hardening.conf
# Drop-in for the apt-installed caddy.service, installed by provision.sh as
# /etc/systemd/system/caddy.service.d/harden.conf. The stock unit grants
# CAP_NET_ADMIN and a writable /usr; Caddy here only needs to bind 80/443 and
# write its certificates under /var/lib/caddy. RuntimeDirectory holds the
# admin API socket the Caddyfile moves off 127.0.0.1:2019, so no other local
# user (wirefan included) can reconfigure the proxy.
[Service]
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/caddy
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
